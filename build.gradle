plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
}

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    // the log lives in one SQLite file next to the world, shipped inside the jar
    jarJar(implementation("org.xerial:sqlite-jdbc")) {
        version {
            strictly "[${sqlite_version},4)"
            prefer sqlite_version
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand replaceProperties }
}

idea { module { downloadSources = true; downloadJavadoc = true } }
